# Workflow Catalog
# Used by /ags-help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if ≥1 file matches (or min_count)
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#
# required: true → blocks progression to next phase (shown as REQUIRED)
# required: false → optional enhancement (shown as OPTIONAL)
# repeatable: true → runs multiple times (one per system, story, epic, etc.)
#
# Phase gates (/ags-gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.
#
# Iteration model: epic = vertical slice. An epic may:
#  - introduce 1-3 NEW systems (mode: new)
#  - REVISE existing systems (mode: revise) — extend, refactor, rewire
#  - STUB neighbor systems (mode: stub) — interface only, deferred impl
# Production phase loops `per_epic_steps` until feature-complete.

phases:

  concept:
    label: "Concept"
    description: "Game idea, pillars, art direction, systems map"
    next_phase: foundation
    steps:
      - id: brainstorm
        name: "Brainstorm"
        command: /ags-brainstorm
        required: false
        description: "Explore game concept using MDA, verb-first, player psychology frameworks"

      - id: engine-setup
        name: "Engine Setup"
        command: /ags-setup-engine
        required: true
        artifact:
          glob: ".ags/rules/technical-preferences.md"
          pattern: "Engine: [^[]"
        description: "Configure engine, pin version, naming conventions, perf budgets"

      - id: game-concept
        name: "Game Concept Document"
        command: /ags-brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "Formalize concept with pillars, MDA, scope tiers"

      - id: design-review-concept
        name: "Concept Review"
        command: /ags-design-review
        required: false
        description: "Validate game concept (recommended before proceeding)"

      - id: art-bible
        name: "Art Bible"
        command: /ags-art-bible
        required: true
        artifact:
          glob: "design/art/ags-art-bible.html"
        description: "Visual identity specification (11 sections, HTML). Uses Visual Identity Anchor from /ags-brainstorm"

      - id: map-systems
        name: "Systems Map"
        command: /ags-map-systems
        required: true
        artifact:
          glob: "design/gdd/systems-index.md"
        description: "Decompose concept into systems with dependency ordering and priority tiers. Drives epic planning."

      - id: gate-concept-to-foundation
        name: "Gate: Concept → Foundation"
        command: /ags-gate-check
        required: true
        description: "Phase gate validating concept completeness before foundation work"

  foundation:
    label: "Foundation"
    description: "Minimum architecture skeleton, accessibility commitment, programmer rules, test scaffold — everything needed to start the first epic"
    next_phase: production
    steps:
      - id: architecture-skeleton
        name: "Architecture Skeleton"
        command: /ags-create-architecture
        required: true
        artifact:
          glob: "design/architecture/architecture.md"
        description: "Master architecture skeleton — top-level layers, module boundaries, tech stack. ADRs accumulate per epic in production."

      - id: accessibility-doc
        name: "Accessibility Requirements"
        required: true
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "Commit accessibility tier (Basic / Standard / Comprehensive / Exemplary) and feature matrix. Referenced by every epic with UX work."

      - id: control-manifest-seed
        name: "Control Manifest (seed)"
        command: /ags-create-control-manifest
        required: true
        artifact:
          glob: "design/architecture/control-manifest.md"
        description: "Flat programmer rules sheet — initial seed. Refreshed periodically in production as ADRs accumulate."

      - id: test-setup
        name: "Test Framework Setup"
        command: /test-setup
        required: false
        artifact:
          note: "Check tests/ directory for engine-specific test framework scaffold"
        description: "Scaffold test framework + CI once before first epic"

      - id: gate-foundation-to-production
        name: "Gate: Foundation → Production"
        command: /ags-gate-check
        required: true
        description: "Phase gate validating readiness to start epics"

  production:
    label: "Production"
    description: "Epic-driven vertical slices. Each epic = 1-3 systems (new / revise / stub) designed and implemented together. Loop until feature-complete."
    next_phase: polish
    per_epic_steps:
      - id: epic-plan
        name: "Plan Epic (vertical slice)"
        command: /ags-create-epics
        required: true
        repeatable: true
        artifact:
          glob: ".ags/project/epics/*/EPIC.md"
          min_count: 1
        description: "Define one epic: 1-3 systems in scope (new / revise / stub modes), rationale, contracts, acceptance"

      - id: design-systems
        name: "Design In-Scope Systems"
        command: /ags-design-system
        required: true
        repeatable: true
        artifact:
          glob: "design/gdd/*.md"
        description: "Author or extend GDD sections for systems in this epic. For `revise` mode, document changes and impact in EPIC.md Existing System Changes."

      - id: design-review
        name: "Design Review (epic scope)"
        command: /ags-design-review
        required: false
        repeatable: true
        description: "Validate GDD additions/changes for this epic"

      - id: epic-arch
        name: "Architecture Decisions for Epic"
        command: /ags-architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "design/architecture/adr-*.md"
        description: "Add ADRs for this epic's architectural choices. Skeleton from foundation grows here. Required for revise epics that change architecture."

      - id: contracts
        name: "Stub Contracts"
        command: /ags-epic-contracts
        required: true
        repeatable: true
        description: "Lock minimal API for stub neighbors. Stable interfaces, recorded in EPIC.md Contracts section."

      - id: ux-design
        name: "UX Specs (epic scope)"
        command: /ux-design
        required: false
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
        description: "UX specs for screens introduced or changed by this epic. Required if epic has UI/UX work."

      - id: ux-review
        name: "UX Review (epic scope)"
        command: /ux-review
        required: false
        repeatable: true
        description: "Validate UX specs against accessibility tier and GDD. Required if /ux-design ran for this epic."

      - id: stories
        name: "Create Stories for Epic"
        command: /ags-create-stories
        required: true
        repeatable: true
        artifact:
          glob: ".ags/project/epics/*/stories/*.md"
        description: "Break epic into implementable stories"

      - id: implement
        name: "Implement Stories"
        command: /ags-dev-story
        required: true
        repeatable: true
        description: "Pick next ready story; implement with stubs marked `// TODO(epic-[id]):`"

      - id: stub-track
        name: "Track Stubs"
        command: /ags-stub-track
        required: true
        repeatable: true
        artifact:
          glob: ".ags/project/stubs.md"
        description: "Sync stubs.md with code markers introduced/closed during epic"

      - id: code-review
        name: "Code Review"
        command: /ags-code-review
        required: false
        repeatable: true
        description: "Architectural code review per story before story-done"

      - id: story-done
        name: "Story Done Review"
        command: /ags-story-done
        required: true
        repeatable: true
        description: "Verify acceptance criteria, GDD/ADR deviations, close story"

      - id: qa-plan
        name: "QA Plan (epic)"
        command: /ags-qa-plan
        required: false
        repeatable: true
        description: "Generate test plan for the epic"

      - id: bug-report
        name: "Bug Report / Triage"
        command: /ags-bug-report
        required: false
        repeatable: true
        description: "Log and prioritize bugs found during epic"

      - id: playtest
        name: "Epic Playtest"
        command: /ags-playtest-report
        required: true
        repeatable: true
        artifact:
          glob: ".ags/project/playtests/*.md"
        description: "Playtest the playable slice produced by this epic"

      - id: scope-check
        name: "Scope Check"
        command: /ags-scope-check
        required: false
        repeatable: true
        description: "Detect scope creep within an epic vs original definition"

      - id: consistency-check
        name: "Cross-GDD Consistency"
        command: /ags-consistency-check
        required: true
        repeatable: true
        description: "Scan all GDDs for contradictions, undefined references introduced by this epic"

      - id: cross-gdd-review
        name: "Cross-GDD Review (holistic)"
        command: /ags-review-all-gdds
        required: true
        repeatable: true
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "Holistic consistency + design theory review across all GDDs after this epic's GDD changes"

      - id: architecture-review
        name: "Architecture Review"
        command: /ags-architecture-review
        required: true
        repeatable: true
        artifact:
          glob: "design/architecture/architecture-review-*.md"
        description: "Validate cumulative architecture coherence including this epic's ADRs"

      - id: control-manifest-refresh
        name: "Control Manifest Refresh"
        command: /ags-create-control-manifest
        required: false
        repeatable: true
        description: "Regenerate control manifest after several epics have added ADRs. Recommended every 3-5 epics."

      - id: team-feature
        name: "Team Orchestration (optional)"
        required: false
        repeatable: true
        description: "Coordinate multiple agents on a complex epic. Use: /ags-team-combat, /ags-team-narrative, /team-ui, /ags-team-audio, /ags-team-level, /ags-team-live-ops, /ags-team-qa"

      - id: epic-retro
        name: "Epic Retrospective"
        command: /ags-epic-retro
        required: true
        repeatable: true
        description: "Capture what worked, what to change. Append to EPIC.md and decisions-log.md"

      - id: epic-gate
        name: "Gate: Epic Done"
        command: /ags-gate-check
        required: true
        repeatable: true
        description: "Lean gate per epic: verify acceptance, stubs closed/migrated. Close in epics/index.md."

      - id: gate-production-to-polish
        name: "Gate: Production → Polish"
        command: /ags-gate-check
        required: true
        description: "Phase gate after all MVP epics done. Run once at end of production loop."

  polish:
    label: "Polish"
    description: "Performance, balance, playtesting, bug fixing"
    next_phase: release
    steps:
      - id: perf-profile
        name: "Performance Profile"
        command: /ags-perf-profile
        required: false
        description: "Profile and optimize CPU/GPU/memory bottlenecks"

      - id: balance-check
        name: "Balance Check"
        command: /ags-balance-check
        required: false
        description: "Analyze game balance formulas and data"

      - id: asset-audit
        name: "Asset Audit"
        command: /ags-asset-audit
        required: false
        description: "Verify naming, formats, size budgets"

      - id: playtest-polish
        name: "Playtest Sessions (×3)"
        command: /ags-playtest-report
        required: true
        artifact:
          glob: ".ags/project/playtests/*.md"
          min_count: 3
        description: "Cover: new player experience, mid-game systems, difficulty curve"

      - id: team-polish
        name: "Polish Team Pass"
        command: /ags-team-polish
        required: true
        description: "Coordinated polish pass across performance, audio, visual, UX"

      - id: gate-polish-to-release
        name: "Gate: Polish → Release"
        command: /ags-gate-check
        required: true
        description: "Phase gate to release"

  release:
    label: "Release"
    description: "Launch preparation, certification, ship"
    next_phase: null
    steps:
      - id: release-checklist
        name: "Release Checklist"
        command: /ags-release-checklist
        required: true
        description: "Pre-release validation: code, content, store, legal"

      - id: patch-notes
        name: "Patch Notes"
        command: /ags-patch-notes
        required: false
        description: "Player-facing patch notes from git history and epic data"

      - id: changelog
        name: "Changelog"
        command: /ags-changelog
        required: false
        description: "Auto-generate internal changelog"

      - id: launch-checklist
        name: "Launch Checklist"
        command: /ags-launch-checklist
        required: true
        description: "Final launch readiness — last gate before shipping"
